<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간업무 보고 - 계리결산팀 운영관리포탈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=28">
  <style>
    .wr-toolbar {
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      background:#fff; border:1.5px solid #e5e7eb; border-radius:14px;
      padding:14px 18px; margin-bottom:16px;
    }
    .wr-toolbar select, .wr-toolbar input {
      padding:8px 12px; border:1.5px solid #e5e7eb; border-radius:9px;
      font-size:13.5px; color:#374151; background:#fff;
    }
    .wr-toolbar select:focus, .wr-toolbar input:focus { outline:none; border-color:#4f86f7; }
    .wr-toolbar .label { font-size:12px; color:#6b7280; font-weight:600; margin-left:4px; }
    .wr-toolbar .spacer { flex:1; }
    .wr-toolbar .base-hint { font-size:12px; color:#9ca3af; font-style:italic; margin-left:8px; }

    .wr-period-badge {
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 14px; background:linear-gradient(135deg,#eff6ff,#e0e7ff);
      color:#3730a3; font-weight:800; font-size:13.5px; border-radius:9px;
      border:1.5px solid #c7d2fe;
    }
    .wr-period-badge i { color:#6366f1; }

    .wr-btn {
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 14px; border-radius:9px; border:1.5px solid #e5e7eb;
      background:#fff; color:#374151; font-size:13.5px; font-weight:600;
      cursor:pointer; transition:all .15s;
    }
    .wr-btn:hover { border-color:#4f86f7; color:#4f86f7; background:#eff6ff; }
    .wr-btn-primary { background:linear-gradient(135deg,#4f86f7,#6c5ce7); color:#fff; border-color:transparent; }
    .wr-btn-primary:hover { background:linear-gradient(135deg,#3a6fd8,#5849c4); color:#fff; }
    .wr-btn-download { background:linear-gradient(135deg,#059669,#10b981); color:#fff; border-color:transparent; }
    .wr-btn-download:hover { background:linear-gradient(135deg,#047857,#059669); color:#fff; }

    .wr-view-panel {
      background:#fff; border:1.5px solid #e5e7eb; border-radius:14px;
      padding:12px 16px; margin-bottom:16px;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .wr-view-panel .lbl { font-size:12.5px; font-weight:700; color:#374151; }
    .wr-view-panel .chip {
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 10px 5px 12px; border-radius:999px;
      background:#eef2ff; color:#3730a3; font-size:12.5px; font-weight:700;
    }
    .wr-view-panel .chip.me { background:linear-gradient(135deg,#c7d2fe,#a5b4fc); color:#312e81; }
    .wr-view-panel .chip .x {
      cursor:pointer; padding:0 4px; margin-left:2px; color:#6366f1;
      font-weight:900; border:none; background:none;
    }
    .wr-view-panel .chip .x:hover { color:#dc2626; }

    .wr-stat-bar {
      display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;
    }
    .wr-stat-card {
      background:#fff; border:1.5px solid #f3f4f6; border-radius:14px;
      padding:14px 20px; text-align:center;
    }
    .wr-stat-label { font-size:11px; color:#9ca3af; font-weight:500; margin-bottom:4px; }
    .wr-stat-value { font-size:24px; font-weight:800; color:#111827; }
    .wr-stat-value.g { color:#10b981; }
    .wr-stat-value.b { color:#3b82f6; }
    .wr-stat-value.o { color:#9ca3af; }

    .wr-table-wrap {
      background:#fff; border:1.5px solid #e5e7eb; border-radius:14px; overflow:hidden;
    }
    .wr-table-head {
      padding:14px 18px; border-bottom:1px solid #f3f4f6;
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    .wr-table-title { font-size:15px; font-weight:700; color:#111827; display:flex; align-items:center; gap:8px; }
    .wr-table-title i { color:#4f86f7; }
    .wr-table-scroll { overflow-x:auto; }
    .wr-tbl { width:100%; border-collapse:collapse; font-size:13px; min-width:1560px; }
    .wr-tbl thead th {
      background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);

      padding:10px 8px; text-align:left; border-bottom:2px solid #cbd5e1; white-space:nowrap;

    }

    .wr-tbl tbody tr.new-row { background:#fefce8; }
    .wr-tbl tbody tr.readonly-row td { background:#fbfbfd; }
    .wr-tbl tbody tr.pending-delete-row td { background:#fef2f2 !important; opacity:0.6; text-decoration:line-through; }
    .wr-tbl tbody tr.pending-delete-row td:first-child { text-decoration:none; }
    .wr-tbl tbody tr.pending-delete-row .del-btn { background:#fee2e2; color:#991b1b; }
    .wr-tbl tbody tr.group-header td {
      background:linear-gradient(90deg,#f8faff,#fff);

    .wr-tbl tbody tr.group-header .badge {

    }
    .wr-tbl tbody tr.group-header .badge.me { background:#dcfce7; color:#166534; }
    .wr-tbl input, .wr-tbl select, .wr-tbl textarea {
      width:100%; padding:6px 8px; border:1px solid transparent; border-radius:6px;
      font-size:12.5px; font-family:inherit; color:#111827; background:#fff;
      box-sizing:border-box; resize:none;
    }
    .wr-tbl input:focus, .wr-tbl select:focus, .wr-tbl textarea:focus {
      outline:none; border-color:#4f86f7; background:#eff6ff;

    .wr-tbl input:hover, .wr-tbl select:hover, .wr-tbl textarea:hover { border-color:#e5e7eb; }

    .ext-연장 { background:#fef3c7 !important; color:#92400e; font-weight:700; }
    .ext-종료 { background:#d1fae5 !important; color:#065f46; font-weight:700; }

    .ext-보류 { background:#fee2e2 !important; color:#991b1b; font-weight:700; }

    .wr-add-block {
      padding:12px 18px; background:#fafbfc; border-top:1px solid #f3f4f6;

    .wr-add-block .wr-btn { border-style:dashed; }
    .wr-save-hint { font-size:11.5px; color:#9ca3af; }
    .wr-save-hint.saving { color:#f59e0b; }
    .wr-save-hint.saved  { color:#10b981; }
    .wr-save-hint.error  { color:#ef4444; }

    .type-lock-badge {
      display:inline-block; padding:2px 7px; font-size:10px; font-weight:800;

    }

    @media (max-width:768px) {
      .wr-stat-bar { grid-template-columns:1fr 1fr; }
      .wr-toolbar { padding:10px 12px; }

  </style>

        <span class="lbl">업무유형</span>
        <span class="chip" title="IFRS17 결산">Ⅰ · IFRS17 결산</span>
        <span class="chip" title="결산 실무 (준비금·비금·계약)">Ⅱ · 결산 실무</span>
        <span class="chip" title="차세대 시스템 구축">Ⅲ · 차세대</span>

        <span class="chip" title="대내외 대응 (감독원·회계법인·계리법인)">Ⅴ · 대내외 대응</span>

                <th style="min-width:220px;">다음주 할 일</th>
                <th style="min-width:150px;">이슈·비고</th>

<script src="js/rbac.js?v=31"></script>

<script>
Portal.init();
try {

const currentUser = RBAC.getCurrentUser();
const roleOf = currentUser && currentUser.role;
const isLeader = roleOf === 'team_leader';
const isChief  = roleOf === 'section_chief';
const canManageAll = !!(isLeader || isChief);       // 팀장·실장 = 전체 관리 뷰
const myName = (currentUser && (currentUser.full_name || currentUser.username)) || '';

// 다운로드 버튼 노출
if (canManageAll) {
  document.getElementById('btnDlPerson').style.display = '';
  document.getElementById('btnDlType').style.display = '';
  document.getElementById('btnDlAll').style.display = '';
} else {
  document.getElementById('btnDlMineAll').style.display = '';
  document.getElementById('btnDlMyView').style.display = '';
  document.getElementById('thWorkType').style.display = 'none';
}

// ── 주차 계산 (ISO 8601) ────────────────────────────────
function isoWeek(d) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
  return { year: dt.getUTCFullYear(), week: weekNo };
}
function mondayOfWeek(year, week) {
  const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
  const iso = new Date(simple);
  const dow = simple.getUTCDay();
  if (dow <= 4) iso.setUTCDate(simple.getUTCDate() - simple.getUTCDay() + 1);
  else iso.setUTCDate(simple.getUTCDate() + 8 - simple.getUTCDay());
  return iso;
}
function sundayOfWeek(year, week) {
  const m = mondayOfWeek(year, week);
  const s = new Date(m); s.setUTCDate(m.getUTCDate() + 6); return s;
}
function weeksInYear(year) {
  const d = new Date(Date.UTC(year, 11, 31));
  return isoWeek(d).week === 1 ? isoWeek(new Date(Date.UTC(year, 11, 24))).week : isoWeek(d).week;
}
function nthWeekOfMonth(dateObj) {
  const y = dateObj.getFullYear(), m = dateObj.getMonth();
  const firstMondayOffset = new Date(y, m, 1).getDay();
  const day = dateObj.getDate();
  return Math.ceil((day + (firstMondayOffset === 0 ? 6 : firstMondayOffset - 1)) / 7);
}
function weekLabel(year, week) {
  const mon = mondayOfWeek(year, week);
  const nth = nthWeekOfMonth(mon);
  return `'${String(year).slice(2)}년 ${mon.getUTCMonth() + 1}월 ${nth}주차`;
}
function weekPeriodText(year, week) {
  const mon = mondayOfWeek(year, week), sun = sundayOfWeek(year, week);
  const fmt = d => `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${String(d.getUTCDate()).padStart(2, '0')}`;
  return `${fmt(mon)} ~ ${fmt(sun)}`;
}

// ── 툴바 세팅 ────────────────────────────────────
const today = new Date();
const cur = isoWeek(today);
const yearSel = document.getElementById('yearSel');
for (let y = cur.year - 2; y <= cur.year + 1; y++) {
  const o = document.createElement('option'); o.value = y; o.textContent = y + '년'; yearSel.appendChild(o);
}
yearSel.value = cur.year;
function fillWeekSel(year) {
  const weekSel = document.getElementById('weekSel');
  weekSel.innerHTML = '';
  const total = weeksInYear(year);
  for (let w = 1; w <= total; w++) {
    const mon = mondayOfWeek(year, w);
    const label = `${w}주차 (${mon.getUTCMonth() + 1}/${mon.getUTCDate()} ~)`;
    const o = document.createElement('option'); o.value = w; o.textContent = label;
    weekSel.appendChild(o);
  }
}
fillWeekSel(cur.year);
document.getElementById('weekSel').value = cur.week;
document.getElementById('baseDate').value = today.toISOString().slice(0, 10);
updatePeriodText();

yearSel.addEventListener('change', () => { fillWeekSel(Number(yearSel.value)); onWeekChange(); });
document.getElementById('weekSel').addEventListener('change', onWeekChange);
document.getElementById('baseDate').addEventListener('change', onBaseChange);

function updatePeriodText() {
  const y = Number(yearSel.value), w = Number(document.getElementById('weekSel').value);
  document.getElementById('periodText').textContent = weekPeriodText(y, w);
}
function onWeekChange() {
  // 사용자가 주차를 실제로 바꾼 순간에만 스택 리셋 (이전 주 undo 는 무의미)
  UNDO_STACK = [];
  updateUndoButton();
  const y = Number(yearSel.value), w = Number(document.getElementById('weekSel').value);
  document.getElementById('baseDate').value = mondayOfWeek(y, w).toISOString().slice(0, 10);
  updatePeriodText();
  loadWeek();
}
function onBaseChange() {
  UNDO_STACK = [];
  updateUndoButton();
  const d = new Date(document.getElementById('baseDate').value);
  if (isNaN(d)) return;
  const { year, week } = isoWeek(d);
  yearSel.value = year; fillWeekSel(year); document.getElementById('weekSel').value = week;
  updatePeriodText();
  loadWeek();
}

// ── 상태 ──────────────────────────────────────────────
let ROWS = [];
let USER_LIST = [];       // 팀원 목록
let VIEW_MEMBERS = [];    // 현재 화면에 표시 중인 팀원 (union 뷰용, 직원 모드)
let UNDO_STACK = [];      // 액션 히스토리 (LIFO) — 직전 행위 하나씩 되돌리기
// 각 entry : { label: string, kind: 'carry_over'|'delete_mark'|'add_new', undo: async () => void }
let currentYear, currentWeek, currentLabel, currentBase, currentPeriod;

const EXTS = ['신규', '연장', '종료', '상시', '보류'];
const WORK_TYPE_LABEL = {
  'Ⅰ': 'IFRS17 결산',
  'Ⅱ': '결산 실무(준비금·비금·계약)',
  'Ⅲ': '차세대 시스템 구축',
  'Ⅳ': '모델·시스템 관리',
  'Ⅴ': '대내외 대응',
  'Ⅵ': '관리회계 및 기타',
};

async function loadUsers() {
  const r = await fetch('/tables/users?limit=200');
  const d = await r.json();
  USER_LIST = (d.rows || d.data || [])
    .filter(u => u.is_active !== false && u.full_name && u.role !== 'team_leader')
    .map(u => u.full_name)
    .sort((a, b) => a.localeCompare(b, 'ko'));
}

function initViewMembers() {
  // 팀장·실장 = 전 팀원 union · 직원 = 자기만 (버튼으로 추가)
  if (canManageAll) {
    VIEW_MEMBERS = USER_LIST.slice();  // 전원
  } else {
    VIEW_MEMBERS = [myName];
  }
  renderViewPanel();
}

function renderViewPanel() {
  const chips = document.getElementById('viewChips');
  const lbl   = document.getElementById('viewPanelLbl');
  const addLbl = document.getElementById('addMemberLbl');
  const addSel = document.getElementById('addMemberSel');
  const resetBtn = document.getElementById('btnResetView');

  if (canManageAll) {
    lbl.textContent = '전체 팀원 표시 중 (팀장·실장 뷰)';
    chips.innerHTML = VIEW_MEMBERS.map(n => `<span class="chip">${escHtml(n)}</span>`).join('');
    addLbl.style.display = 'none';
    addSel.style.display = 'none';
    resetBtn.style.display = 'none';
    return;
  }
  // 직원 모드
  lbl.textContent = `내 업무 + 조회 중`;
  chips.innerHTML = VIEW_MEMBERS.map((n, i) => {
    const cls = n === myName ? 'chip me' : 'chip';
    const closeBtn = n === myName ? '' : `<button class="x" title="닫기" onclick="removeViewMember('${escAttr(n)}')">×</button>`;
    return `<span class="${cls}">${escHtml(n)}${closeBtn}</span>`;
  }).join('');

  // 추가 가능 팀원 목록 (본인 + 이미 뷰에 있는 사람 제외)
  const remaining = USER_LIST.filter(n => !VIEW_MEMBERS.includes(n));
  addLbl.style.display = '';
  addSel.style.display = '';
  addSel.innerHTML = '<option value="">-- 팀원 선택 --</option>' +
    remaining.map(n => `<option value="${escAttr(n)}">${escHtml(n)}</option>`).join('');
  addSel.onchange = () => {
    const v = addSel.value; if (!v) return;
    if (!VIEW_MEMBERS.includes(v)) VIEW_MEMBERS.push(v);
    addSel.value = '';
    renderViewPanel();
    renderRows();
  };
  resetBtn.style.display = VIEW_MEMBERS.length > 1 ? '' : 'none';
}

function removeViewMember(name) {
  VIEW_MEMBERS = VIEW_MEMBERS.filter(n => n !== name);
  renderViewPanel();
  renderRows();
}
function resetView() {
  VIEW_MEMBERS = [myName];
  renderViewPanel();
  renderRows();
}

async function loadWeek() {
  currentYear  = Number(yearSel.value);
  currentWeek  = Number(document.getElementById('weekSel').value);
  currentLabel = weekLabel(currentYear, currentWeek);
  currentBase  = document.getElementById('baseDate').value;
  currentPeriod = weekPeriodText(currentYear, currentWeek);
  document.getElementById('tblTitle').textContent =
    `${currentLabel}  (${currentPeriod})  |  기준일 ${currentBase}`;
  setHint('로딩 중…');
  // 스택은 여기서 리셋하지 않는다.
  // - carryOverPrevWeek 이 pushUndo() 직후 loadWeek() 를 호출하므로
  //   여기서 리셋하면 방금 넣은 carry_over 엔트리가 날아감.
  // - 스택 리셋은 (a) 사용자가 실제로 주차/연도/기준일을 바꾼 이벤트 핸들러,
  //   (b) 저장 성공 지점에서만 명시적으로 수행.
  try {
    const r = await fetch(`/tables/weekly_tasks?limit=1000`);
    const d = await r.json();
    const all = (d.rows || d.data || []);
    ROWS = all.filter(t => Number(t.year) === currentYear && Number(t.week_no) === currentWeek);
    // 팀원 첫 방문 시 자기 것 없으면 3행 자동 준비
    const mine = ROWS.filter(r => r.member_name === myName);
    if (!canManageAll && mine.length === 0) {
      for (let i = 0; i < 3; i++) ROWS.push(newEmptyRow(myName));
    }
    renderRows();
    setHint('불러왔습니다.', 'saved');
  } catch (e) {
    setHint('로드 실패: ' + (e.message || e), 'error');
  }
}

function newEmptyRow(name) {
  return {
    _new: true,
    year: currentYear, week_no: currentWeek, week_label: currentLabel, base_date: currentBase, week_period: currentPeriod,
    member_name: name || myName,
    category: '', extension_type: '', task_content: '',
    this_week_done: '', next_week_plan: '',
    issue_note: '', start_date: '', end_date: '',
    progress: null, status: '',
    work_type: '', work_type_detail: '',
  };
}

function canEditRow(r) {
  if (isLeader) return true;                     // 팀장 = 모두 편집
  if (isChief)  return false;                    // 실장 = 조회 (다운로드 O, 편집 X)
  return (r.member_name || '') === myName;       // 직원 = 자기 것만
}

function renderRows() {
  const tbody = document.getElementById('wrTbody');
  // 뷰 대상 결정
  let view;
  if (canManageAll) {
    view = ROWS.slice();
  } else {
    view = ROWS.filter(r => VIEW_MEMBERS.includes(r.member_name || ''));
  }
  // 정렬: VIEW_MEMBERS 순서 우선, 같은 팀원 내에서는 신규 → 기존 순
  if (!canManageAll) {
    const order = new Map(VIEW_MEMBERS.map((n, i) => [n, i]));
    view.sort((a, b) => {
      const oa = order.get(a.member_name) ?? 999;
      const ob = order.get(b.member_name) ?? 999;
      if (oa !== ob) return oa - ob;
      // 신규 행을 상단으로
      return (a._new ? 0 : 1) - (b._new ? 0 : 1);
    });
  } else {
    // 팀장 뷰: 이름 가나다
    view.sort((a, b) => (a.member_name || '').localeCompare(b.member_name || '', 'ko'));
  }

  if (view.length === 0) {
    const msg = canManageAll
      ? '이번 주 등록된 업무가 없습니다. 팀원이 입력하기를 기다려주세요.'
      : (VIEW_MEMBERS.length === 1
        ? '이번 주 등록된 업무가 없습니다. 아래 [새 업무 추가] 로 채워주세요.'
        : '선택한 팀원들에 등록된 업무가 없습니다.');
    tbody.innerHTML = `<tr><td colspan="13" class="empty-msg">${msg}</td></tr>`;
    updateStats(view);
    return;
  }

  // 그룹 헤더 (직원 뷰: 팀원 바뀔 때마다 헤더 삽입)
  let html = '';
  let lastMember = null;
  view.forEach(r => {
    const globalIdx = ROWS.indexOf(r);
    const editable = canEditRow(r);
    const readonlyCls = editable ? '' : 'readonly-row';
    const disAttr = editable ? '' : 'disabled';

    if (!canManageAll && r.member_name !== lastMember) {
      const isMe = r.member_name === myName;
      html += `<tr class="group-header"><td colspan="13">
        <i class="fas fa-user${isMe ? '-check' : ''}"></i> ${escHtml(r.member_name)}
        <span class="badge ${isMe ? 'me' : ''}">${isMe ? '내 업무' : '조회'}</span>
      </td></tr>`;
      lastMember = r.member_name;
    }

    const typeCell = isLeader ? `
      <select ${disAttr} onchange="upd(${globalIdx},'work_type',this.value)" title="Ⅰ IFRS17 결산 · Ⅱ 결산 실무 · Ⅲ 차세대 · Ⅳ 모델·시스템 · Ⅴ 대내외 대응 · Ⅵ 관리회계·기타">
        <option value="">-</option>
        ${['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'].map(k => `<option value="${k}" ${r.work_type===k?'selected':''} title="${escAttr(WORK_TYPE_LABEL[k])}">${k} · ${escHtml(WORK_TYPE_LABEL[k].slice(0,10))}</option>`).join('')}
      </select>` : (canManageAll ? `<span title="${escAttr(WORK_TYPE_LABEL[r.work_type] || '')}">${escHtml(r.work_type || '-')}</span>` : '');

    const memberEditable = isLeader;   // 팀장만 팀원 변경 가능
    const memberCell = memberEditable
      ? `<select onchange="upd(${globalIdx},'member_name',this.value)">
           <option value="">-</option>
           ${USER_LIST.map(n => `<option value="${n}" ${r.member_name===n?'selected':''}>${n}</option>`).join('')}
         </select>`
      : `<div class="member-cell">${escHtml(r.member_name || '')}</div>`;

    const delPending = !!r._pending_delete;
    const rowClasses = [
      r._new ? 'new-row' : '',
      readonlyCls,
      delPending ? 'pending-delete-row' : '',
    ].filter(Boolean).join(' ');
    html += `
      <tr class="${rowClasses}">
        <td>${delPending ? '<span style="color:#dc2626;font-weight:800;font-size:11px;">✕ 삭제 예정</span><br>' : ''}${memberCell}</td>
        <td><input type="text" ${disAttr} placeholder="예: IFRS17 결산" value="${escAttr(r.category || '')}"
          oninput="upd(${globalIdx},'category',this.value)"></td>
        <td><select ${disAttr} class="ext-${r.extension_type || ''}" onchange="upd(${globalIdx},'extension_type',this.value); this.className='ext-'+(this.value||'')">
          <option value="">-</option>
          ${EXTS.map(x => `<option value="${x}" ${r.extension_type===x?'selected':''}>${x}</option>`).join('')}
        </select></td>
        <td><textarea ${disAttr} rows="1" placeholder="업무내용 (필수)" oninput="upd(${globalIdx},'task_content',this.value)">${escHtml(r.task_content || '')}</textarea></td>
        <td><textarea ${disAttr} rows="1" placeholder="이번 주에 한 일" oninput="upd(${globalIdx},'this_week_done',this.value)">${escHtml(r.this_week_done || '')}</textarea></td>
        <td><textarea ${disAttr} rows="1" placeholder="다음 주에 할 일" oninput="upd(${globalIdx},'next_week_plan',this.value)">${escHtml(r.next_week_plan || '')}</textarea></td>
        <td><textarea ${disAttr} rows="1" placeholder="이슈·비고" oninput="upd(${globalIdx},'issue_note',this.value)">${escHtml(r.issue_note || '')}</textarea></td>
        <td><input type="text" ${disAttr} placeholder="YYYY-MM-DD" value="${escAttr(r.start_date || '')}" oninput="upd(${globalIdx},'start_date',this.value)"></td>
        <td><input type="text" ${disAttr} placeholder="YYYY-MM-DD" value="${escAttr(r.end_date || '')}"   oninput="upd(${globalIdx},'end_date',this.value)"></td>
        <td><input type="number" ${disAttr} min="0" max="100" step="10" placeholder="%" value="${r.progress == null ? '' : Math.round(r.progress * 100)}"
          oninput="upd(${globalIdx},'progress', this.value === '' ? null : (Number(this.value)/100))"></td>
        <td><select ${disAttr} class="status-${r.status || ''}" onchange="upd(${globalIdx},'status',this.value); this.className='status-'+(this.value||'')">
          <option value="">-</option>
          <option value="미착수" ${r.status==='미착수'?'selected':''}>미착수</option>
          <option value="진행중" ${r.status==='진행중'?'selected':''}>진행중</option>
          <option value="완료"   ${r.status==='완료'  ?'selected':''}>완료</option>
        </select></td>
        <td>${typeCell}</td>
        <td>${editable && (isLeader || r._new || r.member_name === myName)
              ? `<button class="del-btn" title="삭제" onclick="delRow(${globalIdx})"><i class="fas fa-times"></i></button>`
              : ''}</td>
      </tr>`;
  });

  tbody.innerHTML = html;
  updateStats(view);
}

function updateStats(view) {
  const total = view.filter(r => (r.task_content || '').trim()).length;
  const done  = view.filter(r => r.status === '완료').length;
  const doing = view.filter(r => r.status === '진행중').length;
  const none  = view.filter(r => r.status === '미착수').length;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stDone').textContent  = done;
  document.getElementById('stDoing').textContent = doing;
  document.getElementById('stNone').textContent  = none;
}

function upd(idx, key, val) {
  if (!ROWS[idx]) return;
  if (!canEditRow(ROWS[idx])) return;    // 안전망
  ROWS[idx][key] = val;
  ROWS[idx]._dirty = true;
  setHint('저장하지 않은 변경사항 있음', 'saving');
}

function delRow(idx) {
  const r = ROWS[idx];
  if (!r) return;
  if (!canEditRow(r)) return;
  if (r._new) {
    // 미저장 신규 행 : 즉시 제거 + undo stack 에서 해당 add_new 도 pop (있으면)
    const before = { r, idx };
    ROWS.splice(idx, 1);
    // 스택에서 이 행을 가리키는 add_new 액션 제거 (있을 때)
    UNDO_STACK = UNDO_STACK.filter(e => !(e.kind === 'add_new' && e._ref === r));
    updateUndoButton();
    renderRows();
    setHint('신규 행이 제거되었습니다.', 'saved');
    return;
  }
  // 기존 행 : 즉시 삭제하지 않고 pending 마킹 → 저장 시 실제 DELETE
  if (r._pending_delete) {
    // 재클릭 = 취소 (토글) → 관련 undo entry 도 pop (있으면)
    delete r._pending_delete;
    UNDO_STACK = UNDO_STACK.filter(e => !(e.kind === 'delete_mark' && e._ref === r));
    updateUndoButton();
    renderRows();
    setHint('삭제 예정을 취소했습니다.', 'saved');
    return;
  }
  r._pending_delete = true;
  const preview = (r.task_content || '').slice(0, 24);
  pushUndo({
    kind: 'delete_mark',
    _ref: r,
    label: `삭제 예정 · ${r.member_name || '?'} · "${preview}${preview.length >= 24 ? '…' : ''}"`,
    undo: async () => {
      delete r._pending_delete;
      renderRows();
    },
  });
  renderRows();
  setHint('삭제 예정 · [저장] 눌러야 반영, [되돌리기] 로 취소', 'saving');
}
function undoPendingDelete(idx) { delRow(idx); }

function addRow() {
  const target = canManageAll ? '' : myName;
  const newRow = newEmptyRow(target);
  ROWS.push(newRow);
  pushUndo({
    kind: 'add_new',
    _ref: newRow,
    label: `새 업무 행 추가 (${target || '팀원 미지정'})`,
    undo: async () => {
      const idx = ROWS.indexOf(newRow);
      if (idx >= 0) ROWS.splice(idx, 1);
      renderRows();
    },
  });
  renderRows();
  setHint('행 추가됨 · 저장 필요', 'saving');
  setTimeout(() => {
    const trs = document.querySelectorAll('#wrTbody tr');
    if (trs.length) trs[trs.length - 1].scrollIntoView({ block: 'nearest' });
  }, 30);
}

async function saveAll() {
  setHint('저장 중…', 'saving');
  const t0 = performance.now();

  // 삭제 대상 : pending & id 있음 (신규 미저장은 이미 로컬 제거됨)
  const toDelete = ROWS.filter(r => canEditRow(r) && r._pending_delete && r.id && !r._new);
  const deletes = toDelete.map(r => r.id);

  // upsert 대상 : (신규 or dirty) & task_content 있음 & 삭제예정 아님
  const dirtyRows = ROWS.filter(r => canEditRow(r) && (r._new || r._dirty) && !r._pending_delete && (r.task_content || '').trim());
  const upserts = dirtyRows.map(r => {
    const p = {
      year: currentYear, week_no: currentWeek, week_label: currentLabel, base_date: currentBase, week_period: currentPeriod,
      member_name: r.member_name || myName,
      category: r.category || '', extension_type: r.extension_type || '',
      task_content: r.task_content || '',
      this_week_done: r.this_week_done || '', next_week_plan: r.next_week_plan || '',
      issue_note: r.issue_note || '',
      start_date: r.start_date || '', end_date: r.end_date || '',
      progress: r.progress, status: r.status || '',
      work_type: r.work_type || '', work_type_detail: r.work_type_detail || '',
    };
    if (!r._new && r.id) p.id = r.id;   // 기존 행이면 id 포함해서 PATCH-merge
    return p;
  });

  if (deletes.length === 0 && upserts.length === 0) {
    setHint('저장할 변경사항이 없습니다.', 'saved');
    return;
  }

  try {
    const res = await fetch('/weekly/bulk-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ upserts, deletes }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || String(res.status));

    // 삭제 성공 rows 를 ROWS 에서 제거
    if (d.deleted_count > 0) {
      const delSet = new Set(deletes);
      ROWS = ROWS.filter(r => !delSet.has(r.id));
    }
    // upsert 결과 반영 : bulk-save 는 upserts 순서 = upserted 순서 보장
    for (let i = 0; i < upserts.length; i++) {
      const saved = (d.upserted || [])[i];
      const r = dirtyRows[i];
      if (saved && r) {
        Object.assign(r, saved);
        delete r._new; delete r._dirty;
      }
    }

    renderRows();
    if ((d.upserted?.length || 0) + (d.deleted_count || 0) > 0) {
      UNDO_STACK = [];
      updateUndoButton();
    }
    const ms = Math.round(performance.now() - t0);
    const parts = [];
    if (d.deleted_count) parts.push(`삭제 ${d.deleted_count}건`);
    if (d.upserted?.length) parts.push(`저장 ${d.upserted.length}건`);
    if (d.failures?.length) parts.push(`실패 ${d.failures.length}건`);
    setHint((parts.join(' · ') || '변경사항 없음') + `  (${ms}ms)`, d.failures?.length ? 'error' : 'saved');
  } catch (e) {
    setHint('저장 실패: ' + (e.message || e), 'error');
  }
}

// 다운로드 :
//   canManageAll → view='person'|'typegroup'|'all', 대상=전체
//   직원 → view='person', mineOnly=true 면 자기만, false 면 현재 뷰(union) 전체
function downloadReport(view, mineOnly) {
  const year = currentYear, week = currentWeek;
  const label = encodeURIComponent(currentLabel);
  const base = encodeURIComponent(currentBase);
  let url = `/weekly/export?year=${year}&week=${week}&view=${view}&label=${label}&base=${base}`;
  if (!canManageAll) {
    if (mineOnly) {
      url += '&member=' + encodeURIComponent(myName);
    } else {
      // 현재 뷰(union) 팀원들 전체 · 서버는 &member 단일 지원 → 여러 명은 CSV
      url += '&members=' + encodeURIComponent(VIEW_MEMBERS.join(','));
    }
  }
  window.open(url, '_blank');
}

// ── 되돌리기 (LIFO) : 직전 행위 하나만 취소 ─────────────
function pushUndo(entry) {
  UNDO_STACK.push(entry);
  updateUndoButton();
}
function updateUndoButton() {
  const btn = document.getElementById('btnRevert');
  if (!btn) return;
  if (UNDO_STACK.length === 0) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-undo"></i> 되돌리기';
    btn.title = '되돌릴 행위가 없습니다.';
    btn.style.opacity = '0.5';
    btn.style.cursor = 'not-allowed';
  } else {
    btn.disabled = false;
    btn.innerHTML = `<i class="fas fa-undo"></i> 되돌리기 (${UNDO_STACK.length})`;
    btn.title = `직전 행위: ${UNDO_STACK[UNDO_STACK.length - 1].label}`;
    btn.style.opacity = '';
    btn.style.cursor = '';
  }
}

async function revertChanges() {
  if (UNDO_STACK.length === 0) {
    setHint('되돌릴 행위가 없습니다.', 'saved');
    return;
  }
  const entry = UNDO_STACK[UNDO_STACK.length - 1];
  const stackInfo = UNDO_STACK.length > 1
    ? `\n\n(남은 되돌리기 가능 : ${UNDO_STACK.length - 1}건 — 계속 눌러서 앞선 행위도 순차 취소)`
    : '';
  if (!confirm(`직전 행위를 되돌립니다:\n\n· ${entry.label}${stackInfo}\n\n계속하시겠습니까?`)) return;
  setHint('되돌리는 중…', 'saving');
  try {
    await entry.undo();
    UNDO_STACK.pop();
    updateUndoButton();
    setHint(`되돌렸습니다: ${entry.label}`, 'saved');
  } catch (e) {
    setHint('되돌리기 실패: ' + (e.message || e), 'error');
  }
}

// ── 이전 주 업무 불러오기 (carry-over) ─────────────────
async function carryOverPrevWeek() {
  const toYear = currentYear, toWeek = currentWeek;
  // 직전 주 계산 (ISO week 기준)
  let fromYear = toYear, fromWeek = toWeek - 1;
  if (fromWeek < 1) { fromYear -= 1; fromWeek = weeksInYear(fromYear); }
  const fromLabel = weekLabel(fromYear, fromWeek);
  const fromPeriod = weekPeriodText(fromYear, fromWeek);
  const toPeriod = weekPeriodText(toYear, toWeek);

  // 팀원은 자기 것만, 팀장/실장은 전체 (또는 union 뷰에 담긴 팀원)
  let members = null;
  if (!canManageAll) {
    members = [myName];
  }

  const scopeMsg = canManageAll ? '전체 팀원' : `본인(${myName})`;
  const ok = confirm(
    `직전 주 업무를 이번 주로 복사합니다.\n\n` +
    `[출처] ${fromLabel} (${fromPeriod})\n` +
    `[대상] ${currentLabel} (${toPeriod})\n` +
    `[범위] ${scopeMsg}\n\n` +
    `· 이전 주 '완료' 항목은 제외\n` +
    `· 이미 이번 주에 등록된 동일 업무는 스킵 (중복 방지)\n` +
    `· 기존 '상시' 는 상시 유지, 그 외는 '연장' 으로 자동 표시\n` +
    `· 이번주/다음주 텍스트는 초기화 (새로 작성)\n` +
    `· 진척율·상태·이슈·시작일·완료일은 이월\n\n` +
    `계속하시겠습니까?`
  );
  if (!ok) return;

  setHint('이전 주 데이터 복사 중…', 'saving');
  try {
    const res = await fetch('/weekly/carry-over', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: { year: fromYear, week: fromWeek },
        to: {
          year: toYear, week: toWeek,
          week_label: currentLabel, base_date: currentBase, week_period: currentPeriod,
        },
        members: members,
      }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || String(res.status));
    // undo 스택에 push (carry-over 되돌리기 시 벌크 DELETE)
    if (Array.isArray(d.carried_ids) && d.carried_ids.length > 0) {
      const carriedIds = d.carried_ids.slice();
      pushUndo({
        kind: 'carry_over',
        label: `이전 주 불러오기 · ${d.carried}건 (${fromLabel} → ${currentLabel})`,
        undo: async () => {
          // 벌크 1회 호출 → 서버 파일 write 1번
          await fetch('/weekly/bulk-save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ deletes: carriedIds, upserts: [] }),
          });
          await loadWeek();
        },
      });
    }
    let msg = `${d.carried}건 복사 완료`;
    if (d.skipped_done)      msg += ` · 완료 ${d.skipped_done}건 스킵`;
    if (d.skipped_duplicate) msg += ` · 중복 ${d.skipped_duplicate}건 스킵`;
    if (d.carried > 0)       msg += ' · [되돌리기] 로 취소 가능';
    setHint(msg, 'saved');
    await loadWeek();  // 재로드
  } catch (e) {
    setHint('복사 실패: ' + (e.message || e), 'error');
  }
}

function setHint(msg, cls) {
  const el = document.getElementById('saveHint');
  el.textContent = msg;
  el.className = 'wr-save-hint' + (cls ? ' ' + cls : '');
}
function escAttr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

Object.assign(window, { upd, delRow, undoPendingDelete, addRow, saveAll, downloadReport, removeViewMember, resetView, carryOverPrevWeek, revertChanges });

(async () => {
  await loadUsers();
  initViewMembers();
  await loadWeek();
  updateUndoButton();
})();

} catch (e) {
  if (e && e.message !== 'RBAC_BLOCK') throw e;
}
</script>
</body>
</html>
