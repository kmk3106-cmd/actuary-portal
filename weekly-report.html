<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간업무 보고 - 계리결산팀 운영관리포탈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=28">
  <style>
    .wr-toolbar {
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      background:#fff; border:1.5px solid #e5e7eb; border-radius:14px;
      padding:14px 18px; margin-bottom:18px;
    }
    .wr-toolbar select, .wr-toolbar input {
      padding:8px 12px; border:1.5px solid #e5e7eb; border-radius:9px;
      font-size:13.5px; color:#374151; background:#fff;
    }
    .wr-toolbar select:focus, .wr-toolbar input:focus { outline:none; border-color:#4f86f7; }
    .wr-toolbar .label { font-size:12px; color:#6b7280; font-weight:600; margin-left:4px; }
    .wr-toolbar .spacer { flex:1; }
    .wr-toolbar .base-hint { font-size:12px; color:#9ca3af; font-style:italic; margin-left:8px; }

    .wr-btn {
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 14px; border-radius:9px; border:1.5px solid #e5e7eb;
      background:#fff; color:#374151; font-size:13.5px; font-weight:600;
      cursor:pointer; transition:all .15s;
    }
    .wr-btn:hover { border-color:#4f86f7; color:#4f86f7; background:#eff6ff; }
    .wr-btn-primary { background:linear-gradient(135deg,#4f86f7,#6c5ce7); color:#fff; border-color:transparent; }
    .wr-btn-primary:hover { background:linear-gradient(135deg,#3a6fd8,#5849c4); color:#fff; }
    .wr-btn-download { background:linear-gradient(135deg,#059669,#10b981); color:#fff; border-color:transparent; }
    .wr-btn-download:hover { background:linear-gradient(135deg,#047857,#059669); color:#fff; }

    .wr-stat-bar {
      display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;
    }
    .wr-stat-card {
      background:#fff; border:1.5px solid #f3f4f6; border-radius:14px;
      padding:14px 20px; text-align:center;
    }
    .wr-stat-label { font-size:11px; color:#9ca3af; font-weight:500; margin-bottom:4px; }
    .wr-stat-value { font-size:24px; font-weight:800; color:#111827; }
    .wr-stat-value.g { color:#10b981; }
    .wr-stat-value.b { color:#3b82f6; }
    .wr-stat-value.o { color:#9ca3af; }

    .wr-table-wrap {
      background:#fff; border:1.5px solid #e5e7eb; border-radius:14px;
      overflow:hidden;
    }
    .wr-table-head {
      padding:14px 18px; border-bottom:1px solid #f3f4f6;
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    .wr-table-title { font-size:15px; font-weight:700; color:#111827; display:flex; align-items:center; gap:8px; }
    .wr-table-title i { color:#4f86f7; }
    .wr-table-scroll { overflow-x:auto; }
    .wr-tbl { width:100%; border-collapse:collapse; font-size:13px; min-width:1080px; }
    .wr-tbl thead th {
      background:linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%);
      color:#334155; font-weight:800; font-size:11.5px;
      padding:10px 8px; text-align:left; border-bottom:2px solid #cbd5e1; white-space:nowrap;
    }
    .wr-tbl tbody td {
      padding:6px 6px; border-bottom:1px solid #f3f4f6; vertical-align:top;
    }
    .wr-tbl tbody tr:hover { background:#fafbff; }
    .wr-tbl tbody tr.new-row { background:#fefce8; }
    .wr-tbl input, .wr-tbl select, .wr-tbl textarea {
      width:100%; padding:6px 8px; border:1px solid transparent; border-radius:6px;
      font-size:12.5px; font-family:inherit; color:#111827; background:#fff;
      box-sizing:border-box; resize:none;
    }
    .wr-tbl input:focus, .wr-tbl select:focus, .wr-tbl textarea:focus {
      outline:none; border-color:#4f86f7; background:#eff6ff;
    }
    .wr-tbl input:hover, .wr-tbl select:hover, .wr-tbl textarea:hover {
      border-color:#e5e7eb;
    }
    .wr-tbl textarea { min-height:34px; line-height:1.4; }
    .wr-tbl .del-btn {
      width:26px; height:26px; padding:0; border:none; background:#fef2f2;
      color:#ef4444; border-radius:6px; cursor:pointer; font-size:11px;
    }
    .wr-tbl .del-btn:hover { background:#fee2e2; }
    .wr-tbl .status-미착수 { color:#64748b; }
    .wr-tbl .status-진행중 { color:#1d4ed8; font-weight:700; }
    .wr-tbl .status-완료   { color:#059669; font-weight:700; }
    .wr-tbl .member-cell   { font-weight:800; color:#0f172a; padding-left:10px; }
    .wr-tbl .empty-msg     { text-align:center; padding:40px; color:#9ca3af; font-size:13px; }

    .wr-add-block {
      padding:12px 18px; background:#fafbfc; border-top:1px solid #f3f4f6;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    }
    .wr-add-block .wr-btn { border-style:dashed; }
    .wr-save-hint { font-size:11.5px; color:#9ca3af; }
    .wr-save-hint.saving { color:#f59e0b; }
    .wr-save-hint.saved  { color:#10b981; }
    .wr-save-hint.error  { color:#ef4444; }

    .type-lock-badge {
      display:inline-block; padding:2px 7px; font-size:10px; font-weight:800;
      background:#fef2f2; color:#dc2626; border-radius:5px; margin-left:5px;
    }

    @media (max-width:768px) {
      .wr-stat-bar { grid-template-columns:1fr 1fr; }
      .wr-toolbar { padding:10px 12px; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar"></div>
  <div class="main-content">
    <header class="page-header">
      <h1 class="page-title"><i class="fas fa-calendar-week"></i> 주간업무 보고</h1>
      <div id="dlBtnWrap"></div>
    </header>
    <main class="content-body">

      <div class="wr-toolbar">
        <span class="label">주차</span>
        <select id="yearSel"></select>
        <select id="weekSel"></select>
        <input type="date" id="baseDate">
        <span class="base-hint">기준일 (선택 시 해당 주차 자동)</span>
        <span class="spacer"></span>
        <select id="memberFilterSel" style="display:none;"><option value="">전체 팀원</option></select>
        <button class="wr-btn" id="btnDlPerson"    onclick="downloadReport('person')"    style="display:none;"><i class="fas fa-file-excel"></i> 인별 다운로드</button>
        <button class="wr-btn wr-btn-download" id="btnDlType" onclick="downloadReport('typegroup')" style="display:none;"><i class="fas fa-file-excel"></i> 업무유형별 다운로드</button>
        <button class="wr-btn wr-btn-download" id="btnDlAll"  onclick="downloadReport('all')"       style="display:none;"><i class="fas fa-file-excel"></i> 통합 다운로드 (2시트)</button>
        <button class="wr-btn"                  id="btnDlMe"                                        style="display:none;" onclick="downloadReport('person')"><i class="fas fa-file-excel"></i> 내 주간업무 다운로드</button>
      </div>

      <div class="wr-stat-bar">
        <div class="wr-stat-card"><div class="wr-stat-label">과제 건수</div><div class="wr-stat-value"     id="stTotal">0</div></div>
        <div class="wr-stat-card"><div class="wr-stat-label">완료</div>     <div class="wr-stat-value g"   id="stDone">0</div></div>
        <div class="wr-stat-card"><div class="wr-stat-label">진행중</div>   <div class="wr-stat-value b"   id="stDoing">0</div></div>
        <div class="wr-stat-card"><div class="wr-stat-label">미착수</div>   <div class="wr-stat-value o"   id="stNone">0</div></div>
      </div>

      <div class="wr-table-wrap">
        <div class="wr-table-head">
          <div class="wr-table-title">
            <i class="fas fa-list-check"></i>
            <span id="tblTitle">주간업무 입력</span>
          </div>
          <div class="wr-save-hint" id="saveHint">저장 시 자동 반영됩니다.</div>
        </div>
        <div class="wr-table-scroll">
          <table class="wr-tbl">
            <thead>
              <tr>
                <th style="width:80px;">팀원</th>
                <th style="width:140px;">구분</th>
                <th style="min-width:280px;">업무내용 <span style="color:#dc2626">*</span></th>
                <th style="min-width:170px;">이슈·비고</th>
                <th style="width:120px;">시작일</th>
                <th style="width:120px;">완료(예정)</th>
                <th style="width:80px;">진척율</th>
                <th style="width:90px;">상태</th>
                <th style="width:80px;" id="thWorkType">업무유형<span class="type-lock-badge">팀장</span></th>
                <th style="width:38px;"></th>
              </tr>
            </thead>
            <tbody id="wrTbody"></tbody>
          </table>
        </div>
        <div class="wr-add-block">
          <button class="wr-btn" onclick="addRow()"><i class="fas fa-plus"></i> 새 업무 추가</button>
          <div>
            <button class="wr-btn wr-btn-primary" onclick="saveAll()"><i class="fas fa-save"></i> 저장</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/rbac.js?v=31"></script>
<script src="js/auth.js"></script>
<script src="js/portal.js?v=32"></script>
<script>
Portal.init();
try {

const isLeader = RBAC.isTeamLeader();
const currentUser = RBAC.getCurrentUser();
const canManageAll = !!(currentUser && (currentUser.role === 'team_leader' || currentUser.role === 'section_chief'));
const myName = (currentUser && (currentUser.full_name || currentUser.username)) || '';

// UI 토글 (팀장·실장 = 전체 조회 · 팀장은 편집·다운로드 · 실장은 조회·다운로드)
if (canManageAll) {
  document.getElementById('memberFilterSel').style.display = '';
  document.getElementById('btnDlPerson').style.display = '';
  document.getElementById('btnDlType').style.display = '';
  document.getElementById('btnDlAll').style.display = '';
} else {
  document.getElementById('btnDlMe').style.display = '';
  document.getElementById('thWorkType').style.display = 'none';   // 팀원은 업무유형 열 미노출
}

// ── 주차 계산 (ISO 8601 week) ───────────────────────────────
function isoWeek(d) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
  return { year: dt.getUTCFullYear(), week: weekNo };
}
function mondayOfWeek(year, week) {
  const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
  const dow = simple.getUTCDay();
  const iso = new Date(simple);
  if (dow <= 4) iso.setUTCDate(simple.getUTCDate() - simple.getUTCDay() + 1);
  else iso.setUTCDate(simple.getUTCDate() + 8 - simple.getUTCDay());
  return iso;
}
function weeksInYear(year) {
  const d = new Date(Date.UTC(year, 11, 31));
  return isoWeek(d).week === 1 ? isoWeek(new Date(Date.UTC(year, 11, 24))).week : isoWeek(d).week;
}
function nthWeekOfMonth(dateObj) {
  // 해당 월의 몇 번째 주차인지 (첫날 포함 주 = 1주차)
  const y = dateObj.getFullYear(), m = dateObj.getMonth();
  const firstMondayOffset = new Date(y, m, 1).getDay();
  const day = dateObj.getDate();
  return Math.ceil((day + (firstMondayOffset === 0 ? 6 : firstMondayOffset - 1)) / 7);
}
function weekLabel(year, week) {
  // "'26년 9월 2주차" 형태
  const mon = mondayOfWeek(year, week);
  const nth = nthWeekOfMonth(mon);
  return `'${String(year).slice(2)}년 ${mon.getMonth() + 1}월 ${nth}주차`;
}

// ── 툴바 세팅 ──────────────────────────────────────────────
const today = new Date();
const cur = isoWeek(today);
const yearSel = document.getElementById('yearSel');
for (let y = cur.year - 2; y <= cur.year + 1; y++) {
  const o = document.createElement('option'); o.value = y; o.textContent = y + '년'; yearSel.appendChild(o);
}
yearSel.value = cur.year;
function fillWeekSel(year) {
  const weekSel = document.getElementById('weekSel');
  weekSel.innerHTML = '';
  const total = weeksInYear(year);
  for (let w = 1; w <= total; w++) {
    const mon = mondayOfWeek(year, w);
    const label = `${w}주차 (${mon.getMonth() + 1}/${mon.getDate()} ~)`;
    const o = document.createElement('option'); o.value = w; o.textContent = label;
    weekSel.appendChild(o);
  }
}
fillWeekSel(cur.year);
document.getElementById('weekSel').value = cur.week;
document.getElementById('baseDate').value = today.toISOString().slice(0, 10);

yearSel.addEventListener('change', () => { fillWeekSel(Number(yearSel.value)); onWeekChange(); });
document.getElementById('weekSel').addEventListener('change', onWeekChange);
document.getElementById('baseDate').addEventListener('change', onBaseChange);
document.getElementById('memberFilterSel').addEventListener('change', renderRows);

function onWeekChange() {
  const y = Number(yearSel.value), w = Number(document.getElementById('weekSel').value);
  document.getElementById('baseDate').value = mondayOfWeek(y, w).toISOString().slice(0, 10);
  loadWeek();
}
function onBaseChange() {
  const d = new Date(document.getElementById('baseDate').value);
  if (isNaN(d)) return;
  const { year, week } = isoWeek(d);
  yearSel.value = year; fillWeekSel(year); document.getElementById('weekSel').value = week;
  loadWeek();
}

// ── 상태 ──────────────────────────────────────────────
let ROWS = [];             // 화면 상 편집 중인 행들 (기존 + 신규)
let USER_LIST = [];        // 팀원 목록 (활성)
let currentYear, currentWeek, currentLabel, currentBase;

async function loadUsers() {
  try {
    const r = await fetch('/tables/users?limit=200');
    const d = await r.json();
    USER_LIST = (d.rows || d.data || [])
      .filter(u => u.is_active !== false && u.full_name && u.role !== 'team_leader')
      .map(u => u.full_name)
      .sort((a, b) => a.localeCompare(b, 'ko'));
    const sel = document.getElementById('memberFilterSel');
    sel.innerHTML = '<option value="">전체 팀원</option>' +
      USER_LIST.map(n => `<option value="${n}">${n}</option>`).join('');
  } catch (e) { console.error(e); }
}

async function loadWeek() {
  currentYear = Number(yearSel.value);
  currentWeek = Number(document.getElementById('weekSel').value);
  currentLabel = weekLabel(currentYear, currentWeek);
  currentBase = document.getElementById('baseDate').value;
  document.getElementById('tblTitle').textContent = `${currentLabel}  |  기준일 ${currentBase}`;
  setHint('로딩 중…');
  try {
    const r = await fetch(`/tables/weekly_tasks?limit=500`);
    const d = await r.json();
    const all = (d.rows || d.data || []);
    ROWS = all
      .filter(t => Number(t.year) === currentYear && Number(t.week_no) === currentWeek)
      .filter(t => canManageAll ? true : (t.member_name === myName));
    // 팀원은 최소 3행 자동 생성 (아직 아무것도 없을 때)
    if (!canManageAll && ROWS.length === 0) {
      for (let i = 0; i < 3; i++) ROWS.push(newEmptyRow(myName));
    }
    renderRows();
    setHint('불러왔습니다.', 'saved');
  } catch (e) {
    setHint('로드 실패: ' + (e.message || e), 'error');
  }
}

function newEmptyRow(name) {
  return {
    _new: true,
    year: currentYear, week_no: currentWeek, week_label: currentLabel, base_date: currentBase,
    member_name: name || (canManageAll ? '' : myName),
    category: '', task_content: '', issue_note: '',
    start_date: '', end_date: '',
    progress: null, status: '',
    work_type: '', work_type_detail: '',
  };
}

function memberFilterVal() {
  return canManageAll ? (document.getElementById('memberFilterSel').value || '') : myName;
}

function renderRows() {
  const tbody = document.getElementById('wrTbody');
  const filter = memberFilterVal();
  const view = filter ? ROWS.filter(r => (r.member_name || '') === filter) : ROWS;

  if (view.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" class="empty-msg">
      ${canManageAll
        ? '등록된 업무가 없습니다. 아래 [새 업무 추가] 로 시작하세요.'
        : '이번 주 등록된 업무가 없습니다. 아래 [새 업무 추가] 로 채워주세요.'}
    </td></tr>`;
    updateStats(view);
    return;
  }

  tbody.innerHTML = view.map((r, viewIdx) => {
    const globalIdx = ROWS.indexOf(r);
    const memberEditable = canManageAll;
    const memberCell = memberEditable
      ? `<select onchange="upd(${globalIdx},'member_name',this.value)">
           <option value="">-</option>
           ${USER_LIST.map(n => `<option value="${n}" ${r.member_name===n?'selected':''}>${n}</option>`).join('')}
         </select>`
      : `<div class="member-cell">${escHtml(r.member_name || myName)}</div>`;

    const typeCell = canManageAll ? `
      <select onchange="upd(${globalIdx},'work_type',this.value)">
        <option value="">-</option>
        <option value="Ⅰ" ${r.work_type==='Ⅰ'?'selected':''}>Ⅰ</option>
        <option value="Ⅱ" ${r.work_type==='Ⅱ'?'selected':''}>Ⅱ</option>
        <option value="Ⅲ" ${r.work_type==='Ⅲ'?'selected':''}>Ⅲ</option>
        <option value="Ⅳ" ${r.work_type==='Ⅳ'?'selected':''}>Ⅳ</option>
        <option value="Ⅴ" ${r.work_type==='Ⅴ'?'selected':''}>Ⅴ</option>
        <option value="Ⅵ" ${r.work_type==='Ⅵ'?'selected':''}>Ⅵ</option>
      </select>` : '';

    return `
      <tr class="${r._new ? 'new-row' : ''}">
        <td>${memberCell}</td>
        <td><input type="text" placeholder="예: IFRS17 결산" value="${escAttr(r.category || '')}"
          oninput="upd(${globalIdx},'category',this.value)"></td>
        <td><textarea rows="1" placeholder="업무내용" oninput="upd(${globalIdx},'task_content',this.value)">${escHtml(r.task_content || '')}</textarea></td>
        <td><textarea rows="1" placeholder="이슈·비고" oninput="upd(${globalIdx},'issue_note',this.value)">${escHtml(r.issue_note || '')}</textarea></td>
        <td><input type="text" placeholder="YYYY-MM-DD" value="${escAttr(r.start_date || '')}" oninput="upd(${globalIdx},'start_date',this.value)"></td>
        <td><input type="text" placeholder="YYYY-MM-DD" value="${escAttr(r.end_date || '')}"   oninput="upd(${globalIdx},'end_date',this.value)"></td>
        <td><input type="number" min="0" max="100" step="10" placeholder="%" value="${r.progress == null ? '' : Math.round(r.progress * 100)}"
          oninput="upd(${globalIdx},'progress', this.value === '' ? null : (Number(this.value)/100))"></td>
        <td><select class="status-${r.status || ''}" onchange="upd(${globalIdx},'status',this.value)">
          <option value="">-</option>
          <option value="미착수" ${r.status==='미착수'?'selected':''}>미착수</option>
          <option value="진행중" ${r.status==='진행중'?'selected':''}>진행중</option>
          <option value="완료"   ${r.status==='완료'  ?'selected':''}>완료</option>
        </select></td>
        <td>${typeCell}</td>
        <td><button class="del-btn" title="삭제" onclick="delRow(${globalIdx})"><i class="fas fa-times"></i></button></td>
      </tr>`;
  }).join('');

  updateStats(view);
}

function updateStats(view) {
  const total = view.filter(r => (r.task_content || '').trim()).length;
  const done  = view.filter(r => r.status === '완료').length;
  const doing = view.filter(r => r.status === '진행중').length;
  const none  = view.filter(r => r.status === '미착수').length;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stDone').textContent  = done;
  document.getElementById('stDoing').textContent = doing;
  document.getElementById('stNone').textContent  = none;
}

function upd(idx, key, val) {
  if (!ROWS[idx]) return;
  ROWS[idx][key] = val;
  ROWS[idx]._dirty = true;
  // 팀원 이름 셀렉트가 바뀌면 유형 옆 상태 클래스 갱신 위해 재렌더는 생략 (성능),
  // 상태 셀렉트 색상만 즉시 반영이 필요하면 렌더 재호출 대신 클래스 조작으로 충분.
  if (key === 'status') {
    // 셀렉트 텍스트 색상 즉시 변경
    const sel = event && event.target;
    if (sel) sel.className = 'status-' + (val || '');
  }
  setHint('저장하지 않은 변경사항 있음', 'saving');
}
function delRow(idx) {
  const r = ROWS[idx];
  if (!r) return;
  if (r._new) {
    ROWS.splice(idx, 1);
    renderRows();
    return;
  }
  if (!confirm('이 업무를 삭제하시겠습니까?')) return;
  // 서버에서 즉시 삭제 + 목록에서 제거
  fetch('/tables/weekly_tasks/' + encodeURIComponent(r.id), { method: 'DELETE' })
    .then(res => {
      if (!res.ok) throw new Error('삭제 실패');
      ROWS.splice(idx, 1);
      renderRows();
      setHint('삭제되었습니다.', 'saved');
    })
    .catch(e => setHint('삭제 실패: ' + (e.message || e), 'error'));
}

function addRow() {
  const target = memberFilterVal() || (canManageAll ? '' : myName);
  ROWS.push(newEmptyRow(target));
  renderRows();
  setHint('행 추가됨 · 저장 필요', 'saving');
  // 스크롤 맨 아래로 (편의)
  setTimeout(() => {
    const trs = document.querySelectorAll('#wrTbody tr');
    if (trs.length) trs[trs.length - 1].scrollIntoView({ block: 'nearest' });
  }, 30);
}

async function saveAll() {
  setHint('저장 중…', 'saving');
  const dirty = ROWS.filter(r => (r._new || r._dirty) && (r.task_content || '').trim());
  if (dirty.length === 0) { setHint('저장할 변경사항이 없습니다.', 'saved'); return; }
  let ok = 0, fail = 0;
  for (const r of dirty) {
    // 팀원이 자기 것만 수정하도록 서버측 강제는 없음 (기존 패턴). 프런트에서는 정상 흐름 지원.
    const payload = {
      year: currentYear, week_no: currentWeek, week_label: currentLabel, base_date: currentBase,
      member_name: r.member_name || myName,
      category: r.category || '', task_content: r.task_content || '', issue_note: r.issue_note || '',
      start_date: r.start_date || '', end_date: r.end_date || '',
      progress: r.progress, status: r.status || '',
      work_type: r.work_type || '', work_type_detail: r.work_type_detail || '',
    };
    try {
      let res;
      if (r._new) {
        res = await fetch('/tables/weekly_tasks', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      } else {
        res = await fetch('/tables/weekly_tasks/' + encodeURIComponent(r.id), {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      }
      if (!res.ok) throw new Error(String(res.status));
      const saved = await res.json();
      Object.assign(r, saved);
      delete r._new; delete r._dirty;
      ok++;
    } catch (e) {
      fail++;
    }
  }
  renderRows();
  if (fail === 0) setHint(`${ok}건 저장 완료`, 'saved');
  else setHint(`${ok}건 성공 · ${fail}건 실패`, 'error');
}

function downloadReport(view) {
  const year = currentYear, week = currentWeek;
  const label = encodeURIComponent(currentLabel);
  const base = encodeURIComponent(currentBase);
  let url = `/weekly/export?year=${year}&week=${week}&view=${view}&label=${label}&base=${base}`;
  if (!canManageAll) url += '&member=' + encodeURIComponent(myName);
  // 파일 다운로드 트리거 (a[href][download] 방식보다 window.open 이 안전)
  window.open(url, '_blank');
}

function setHint(msg, cls) {
  const el = document.getElementById('saveHint');
  el.textContent = msg;
  el.className = 'wr-save-hint' + (cls ? ' ' + cls : '');
}
function escAttr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ── 초기화 ─────────────────────────────────────────────
Object.assign(window, { upd, delRow, addRow, saveAll, downloadReport });
(async () => {
  await loadUsers();
  await loadWeek();
})();

} catch (e) {
  if (e && e.message !== 'RBAC_BLOCK') throw e;
}
</script>
</body>
</html>
